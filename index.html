<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="REDCAIRN: land on Mars, suit up, and walk the first Marswalk through your own helmet, on the real ground of Gale crater, behind the rover that drove it first. NASA Space Apps 2026, Interplanetary Survival Guide: Martian Map.">
  <meta name="theme-color" content="#0b0907">
  <meta property="og:title" content="REDCAIRN: your first walk on Mars">
  <meta property="og:description" content="Land, suit up, and follow the rover that went first. Six missions' data, seen through your helmet.">
  <meta property="og:image" content="https://redcairn.netlify.app/assets/img/gale-wide-color.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <title>REDCAIRN · your first walk on Mars</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0907'/%3E%3Cellipse cx='16' cy='24' rx='10' ry='3.6' fill='%23ff6a2b'/%3E%3Cellipse cx='16' cy='16.5' rx='7' ry='3.2' fill='%23ff6a2b'/%3E%3Cellipse cx='16' cy='9.8' rx='4.2' ry='2.8' fill='%23ff6a2b'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-stage="globe" data-step="cover" data-booting>

  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="pins" id="pins"></div>
    <div class="crater" id="crater"></div>
  </div>

  <!-- Cover: one line, one button. -->
  <section class="cover" aria-labelledby="cover-title">
    <p class="cover__mark">Redcairn</p>
    <h1 id="cover-title">In a few minutes you will be the first person to walk on Mars.</h1>
    <button type="button" class="act" data-a="begin">Begin the descent</button>
    <button type="button" class="link" data-a="explore">or open the map</button>
  </section>

  <!-- The lander window during descent. -->
  <div class="lander" aria-live="polite"><div class="lander__txt"><p id="lander-a"></p><p id="lander-b"></p></div><button type="button" class="link" data-a="skip">skip to the landing</button></div>

  <!-- The visor boots: data sources check in, the route is chosen. -->
  <section class="boot" id="boot" hidden aria-label="Visor start-up"></section>

  <!-- The helmet: everything after the hatch is seen through this. -->
  <div class="helmet" aria-hidden="true"></div>
  <section class="hud" aria-label="Helmet display">
    <div class="hud__compass"><div class="hud__strip" id="h-compass-strip"></div><i class="hud__target" id="h-target" hidden></i><b></b></div>
    <p class="hud__met" id="h-met"></p>
    <dl class="hud__suit">
      <div><dt>Air</dt><dd id="h-air">—</dd></div>
      <div><dt>Walk home</dt><dd id="h-home">—</dd></div>
      <div><dt>Dose mSv</dt><dd id="h-dose">—</dd></div>
      <div><dt>Ground</dt><dd id="h-slope">—</dd></div>
    </dl>
    <div class="hud__right">
      <div class="hud__layers" id="h-layers" role="group" aria-label="Map layers"></div>
      <p class="hud__legend" id="h-legend"></p>
      <div class="hud__map" id="h-map"></div>
    </div>
    <figure class="hud__photo" id="h-photo" hidden></figure>
    <ul class="hud__jobs" id="h-jobs" hidden></ul>
    <label class="hud__scrub"><span>Slide along the walk</span><input type="range" id="scrub" min="0" max="1000" value="0"></label>
    <p class="hud__note">Suit numbers and pace are simulated. Ground, route, horizon and radiation rate are real.</p>
  </section>

  <div class="dock">
    <div class="say" id="say" aria-live="polite"></div>
    <div class="actions" id="act"></div>
  </div>
  <section class="end" id="end" hidden></section>

  <button class="about-btn" id="btn-about" type="button">Data &amp; sources</button>
  <dialog class="about" id="about" aria-labelledby="about-title">
    <form method="dialog" class="about__head">
      <h2 id="about-title">Data &amp; sources</h2>
      <button class="link" type="submit">Close</button>
    </form>
    <div class="about__body" id="about-body"></div>
  </dialog>

  <div class="loading" id="loading"><span id="boot-text">Loading Mars…</span></div>
  <noscript><p style="padding:96px 24px;color:#f0e7d9">REDCAIRN needs JavaScript to draw Mars.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
