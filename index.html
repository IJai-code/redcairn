<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="REDCAIRN: a walking guide for the first humans on Mars, built from the tracks, photographs and measurements of the machines that went quiet. NASA Space Apps 2026, Interplanetary Survival Guide: Martian Map.">
  <meta name="theme-color" content="#0d0a08">
  <meta property="og:title" content="REDCAIRN: abandoned, but not forgotten">
  <meta property="og:description" content="A guide for the first walk on Mars, made from what the machines left behind.">
  <meta property="og:image" content="https://redcairn.netlify.app/assets/img/hero.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <title>REDCAIRN: abandoned, but not forgotten · a guide for the first walk on Mars</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0a08'/%3E%3Cellipse cx='16' cy='24' rx='10' ry='3.6' fill='%23e0683a'/%3E%3Cellipse cx='16' cy='16.5' rx='7' ry='3.2' fill='%23e0683a'/%3E%3Cellipse cx='16' cy='9.8' rx='4.2' ry='2.8' fill='%23e0683a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-stage="globe" data-booting>

  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="pins" id="pins"></div>

    <div class="crater" id="crater"></div>

    <div class="stackbig" id="stackbig"><svg id="stack-svg" viewBox="0 20 740 650" preserveAspectRatio="xMidYMid meet"></svg></div>

    <div class="hud" id="hud">
      <div class="chips" id="chips" role="group" aria-label="Map layers"></div>
      <div class="legend" id="legend" hidden></div>
      <div class="mini" id="mini">
        <svg id="mini-svg" viewBox="20 150 370 500" preserveAspectRatio="xMidYMax meet"></svg>
        <p id="mini-note"></p>
      </div>
      <p class="hint">Drag to look around. Double-click to reset.</p>
      <section class="suit" id="suit" aria-live="polite">
        <p class="suit__line" id="suit-line"></p>
        <dl class="suit__nums">
          <div><dt>Air left</dt><dd id="s-air">—</dd></div>
          <div><dt>Walk home</dt><dd id="s-home">—</dd></div>
          <div><dt>Time outside</dt><dd id="s-time">—</dd></div>
          <div><dt>Radiation</dt><dd id="s-dose">—</dd></div>
        </dl>
        <p class="suit__note">Suit numbers are simulated. The ground, the route and the radiation rate are real.</p>
      </section>
    </div>
  </div>
  <div class="scrim"></div>

  <header class="top">
    <a class="logo" href="#top" aria-label="REDCAIRN, back to the start">
      <svg viewBox="0 0 32 30" width="26" height="24" aria-hidden="true"><ellipse cx="16" cy="24" rx="12" ry="4.4"/><ellipse cx="16" cy="15" rx="8.4" ry="3.8"/><ellipse cx="16" cy="7" rx="5" ry="3.3"/></svg>
      <span>Redcairn</span>
    </a>
    <nav class="acts" id="acts" aria-label="Chapters"></nav>
    <button class="link link--top" id="btn-about" type="button">Sources &amp; honesty</button>
    <div class="progress" id="progress"></div>
  </header>

  <main id="story"></main>

  <dialog class="about" id="about" aria-labelledby="about-title">
    <form method="dialog" class="about__head">
      <h2 id="about-title">Sources and honesty</h2>
      <button class="btn btn--ghost" type="submit">Close</button>
    </form>
    <div class="about__body" id="about-body"></div>
  </dialog>

  <div class="boot" id="boot"><span id="boot-text">Waking the map…</span></div>
  <noscript><p style="padding:96px 24px;color:#f0e7d9">REDCAIRN needs JavaScript to draw Mars.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
